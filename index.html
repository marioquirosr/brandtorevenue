/* Brand to Revenue — Color System
   Strategic, not decorative. Every color has a role.
   Ratio discipline: 60% neutrals · 30% purple · 10% accents.
   Magenta is the EXCLUSIVE action color. Yellow NEVER carries text. */

:root {
  /* ---- Raw brand palette ---- */
  --b2r-morado:        #5C38A4; /* Morado Autoridad — structural base */
  --b2r-morado-abismo: #2E1C52; /* Morado Abismo — deep dark surfaces, hero */
  --b2r-morado-niebla: #B9A8DC; /* Morado Niebla — text on dark surfaces */
  --b2r-magenta:       #E91E64; /* Magenta Acción — CTAs / actions ONLY */
  --b2r-amarillo:      #FFE600; /* Amarillo Acento — impact bg, NEVER text bg */

  --b2r-negro:         #1A1525; /* Negro Tinta — primary text on light */
  --b2r-gris-humo:     #6B6478; /* Gris Humo — secondary text */
  --b2r-gris-niebla:   #A8A2B5; /* Gris Niebla — disabled / tertiary text */
  --b2r-blanco:        #FDFCFF; /* Blanco Hueso — base background */
  --b2r-lila:          #F4F1FA; /* Lila Papel — alternating section bg */
  --b2r-borde:         #DDD8EC; /* Borde — hairline borders on light */

  /* Pressed/hover hardened tints (no gradients, just darker solids) */
  --b2r-magenta-press: #C4174F; /* magenta hover/active */
  --b2r-morado-press:  #4A2C86; /* purple hover/active */

  /* ---- Semantic aliases — reference these in product code ---- */
  /* Text */
  --text-strong:    var(--b2r-negro);
  --text-body:      var(--b2r-negro);
  --text-secondary: var(--b2r-gris-humo);
  --text-disabled:  var(--b2r-gris-niebla);
  --text-on-dark:   var(--b2r-blanco);
  --text-muted-dark:var(--b2r-morado-niebla);
  --text-heading:   var(--b2r-morado);

  /* Surfaces */
  --surface-base:    var(--b2r-blanco);
  --surface-alt:     var(--b2r-lila);
  --surface-card:    var(--b2r-blanco);
  --surface-dark:    var(--b2r-morado);
  --surface-abyss:   var(--b2r-morado-abismo);

  /* Borders */
  --border-hairline: var(--b2r-borde);
  --border-strong:   var(--b2r-morado);

  /* Action (magenta is the ONLY action color) */
  --action:          var(--b2r-magenta-press); /* AA-safe resting state (5.86:1 white text) */
  --action-hover:    var(--b2r-magenta);        /* full-brand magenta on hover/active */
  --action-text:     #FFFFFF;

  /* Structure (purple) */
  --structure:       var(--b2r-morado);
  --structure-hover: var(--b2r-morado-press);

  /* Accent (yellow — backgrounds of impact only) */
  --accent-impact:   var(--b2r-amarillo);

  /* Focus ring */
  --focus-ring:      var(--b2r-magenta);
}

/* Brand to Revenue — Typography
   Poppins  → structure, titles, UI, logo, data (geometric sans)
   Figtree → body copy / sustained reading ONLY (humanist serif)
   Roles are NEVER interchangeable: serif never sets a heading. */

:root {
  /* Families */
  --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:    'Figtree', system-ui, -apple-system, sans-serif;
  --font-ui:      'Poppins', system-ui, -apple-system, sans-serif;

  /* Weights (Poppins) */
  --fw-regular:  400; /* @kind font */
  --fw-medium:   500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold:     700; /* @kind font */
  --fw-extrabold:800; /* @kind font */ /* logo lockup, Poppins ExtraBold, non-negotiable */
  --fw-black:    900; /* @kind font */

  /* Type scale — display/structure (Poppins) */
  --fs-display:  72px; /* hero / cover lockups */
  --fs-h1:       44px;
  --fs-h2:       32px;
  --fs-h3:       20px;
  --fs-label:    11px; /* uppercase eyebrow / section tags */
  --fs-small:    13px; /* meta, footnotes, UI captions */

  /* Type scale — body (Figtree) */
  --fs-body-lg:  18px;
  --fs-body:     16px;
  --fs-body-sm:  14px;

  /* Line heights */
  --lh-tight:    1.05; /* @kind font */
  --lh-heading:  1.15; /* @kind font */
  --lh-snug:     1.4;  /* @kind font */
  --lh-body:     1.8;  /* @kind font */

  /* Letter-spacing */
  --ls-display: -0.02em; /* @kind font */
  --ls-heading: -0.01em; /* @kind font */
  --ls-label:    0.22em; /* @kind font */
  --ls-wide:     0.1em;  /* @kind font */
}

/* Brand to Revenue — Spacing, Sizing, Borders, Shadow
   Architectural, square, sharp. NO rounded corners. NO gradients on UI.
   Borders are hairlines or structural left-rules; shadows are restrained. */

:root {
  /* Spacing scale (4px base, architectural rhythm) */
  --space-0:   0;
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   24px;
  --space-6:   32px;
  --space-7:   48px;
  --space-8:   64px;
  --space-9:   100px; /* section gutters in long-form layouts */

  /* Inter-element grid gap used across the system (sharp 2px seams) */
  --seam: 2px;

  /* Radii — the brand is SQUARE. Everything is 0. */
  --radius-none: 0;
  --radius: 0; /* alias — do not introduce rounded corners */

  /* Border widths */
  --border-hair:  1px;
  --border-rule:  3px; /* structural left-rule accent (purple) */
  --border-cta:   2px; /* secondary button outline */

  /* Shadow — used sparingly; flat, neutral, no color bleed */
  --shadow-none: none;
  --shadow-card: 0 1px 0 rgba(26,21,37,0.06), 0 2px 8px rgba(26,21,37,0.05);
  --shadow-pop:  0 8px 28px rgba(46,28,82,0.18);

  /* Focus outline offset */
  --focus-width: 2px;
  --focus-offset: 2px;

  /* Container widths */
  --measure: 700px;   /* readable prose measure */
  --container: 1200px;

  /* Motion — restrained, linear-to-ease, no bounce */
  --ease: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */
  --dur-fast: 120ms; /* @kind other */
  --dur: 200ms; /* @kind other */
}

*{box-sizing:border-box;}body{margin:0;background:var(--b2r-blanco);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}::selection{background:var(--b2r-morado);color:#fff;}a{-webkit-tap-highlight-color:transparent;}img{max-width:100%;}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
section[id] { scroll-margin-top: 80px; }

/* #3 — foco visible, coherente con --focus-ring ya definido en :root */
a:focus-visible, button:focus-visible {
  outline: var(--focus-width) solid var(--focus-ring);
  outline-offset: var(--focus-offset);
}
[data-dark] a:focus-visible, [data-dark] button:focus-visible {
  outline-color: #fff;
}

/* #2 — skip link */
.skip-link{position:absolute;left:-9999px;top:0;background:var(--b2r-morado);color:#fff;padding:12px 20px;font-family:var(--font-ui);font-weight:600;z-index:200;text-decoration:none;}
.skip-link:focus{left:0;}

  }

  /* ---------- Interceptor: todo CTA al playbook o informe abre el modal ---------- */
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a") : null;
    if (!a || !a.href) return;
    for (var key in CFG.resources) {
      if (a.href.indexOf(key) !== -1) {
        e.preventDefault();
        e.stopPropagation();
        openModal(key);
        return;
      }
    }
  }, true);
})();

</script>
</body></html>
